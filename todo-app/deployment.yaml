apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  labels:
    app: todo-app
spec:
  # Tasks are stored in memory, so keep a single replica
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: todo-app
          image: ghcr.io/m1key0m/kubernetes-cicd-tutorial/todo-app:8867a22d676152a928d8d8724fb89886735f34eb
          ports:
            - containerPort: 5000
