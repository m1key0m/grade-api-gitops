apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  labels:
    app: flask-app
spec:
  # Products are stored in memory, so keep a single replica
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: flask-app
          image: ghcr.io/m1key0m/kubernetes-cicd-tutorial/flask-app:5dce1b8151ae7dcd90bd0674d48e2c2b75c3c070
          ports:
            - containerPort: 5070
